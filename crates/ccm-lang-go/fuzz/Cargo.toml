# Standalone workspace (empty [workspace] table below): keeps this fuzzing
# harness out of the parent workspace's `members`/lockfile — it's a throwaway
# tool, not a deliverable crate.
[workspace]

[package]
name = "ccm-lang-go-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ccm-core]
path = "../../ccm-core"

[dependencies.ccm-lang-go]
path = ".."

[[bin]]
name = "parse-go"
path = "fuzz_targets/parse_go.rs"
test = false
doc = false
bench = false
